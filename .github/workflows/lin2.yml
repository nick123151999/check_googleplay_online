# lin 账户谷歌应用巡检
name: lin的账户定时巡检

# 触发方式：手动 + 每小时执行
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # 每小时一次

# 全局环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS_LIN: ${{ secrets.TG_CHAT_IDS_LIN }}
          # TG_CHAT_IDS_LIN2: ${{ secrets.TG_CHAT_IDS_LIN2 }}  # 第二个群（复制启用）
        run: |
          pip install requests
          python lin2.py
